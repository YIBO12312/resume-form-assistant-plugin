<style>

  * { box-sizing: border-box; }
  body { margin:0; padding:28px 32px 60px; background:#f6f7f9; color:var(--ink);
         font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:14px; }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 22px; max-width:1000px; }
  .summary { display:flex; gap:22px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .big { font-size:30px; font-weight:800; }
  .big.ok { color:var(--green); }
  .big.bad { color:var(--red); }
  .bar { height:10px; border-radius:6px; background:#e5e7eb; overflow:hidden; margin:12px 0 20px; }
  .bar i { display:block; height:100%; background:var(--green); transition:width .4s ease; }
  h2 { font-size:14px; margin:22px 0 8px; padding-bottom:6px; border-bottom:1px dashed var(--line); color:var(--blue); }
  .case { display:flex; gap:9px; padding:5px 0; font-size:13px; align-items:baseline; }
  .case .m { flex:none; width:16px; }
  .case.fail { color:var(--red); }
  .case.fail .detail { display:block; color:#7f1d1d; font-size:12px; margin-top:2px; }
  .detail { display:none; }
  .note { font-size:12.5px; color:var(--muted); line-height:1.8; margin-top:18px; }
  code { background:#f3f4f6; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>

  <h1>网申助手 · 识别引擎自测</h1>
  <div class="sub" id="env">正在运行…</div>
  <div class="card">
    <div class="summary">
      <div><span class="big" id="pass">–</span> <span style="color:var(--muted)">通过</span></div>
      <div><span class="big bad" id="fail">–</span> <span style="color:var(--muted)">失败</span></div>
      <div id="verdict" style="font-weight:700"></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div id="results"></div>
    <div class="note">
      这些用例覆盖真实的网申表单结构：左标签右控件表格、thead 表头列、label for、
      Ant Design 结构、单选组、分区标题下的同名时间字段、日期格式改写、下拉选项模糊匹配，
      以及「搜索框 / 验证码 / 密码 / 隐藏元素 / 无语义 name」这些绝不能误填的情况。<br>
      页面只在本机运行，不会发起任何网络请求。
    </div>
  </div>

       「隐藏元素不该被填」这类可见性用例就会失真。 -->

          listKey: list.key,
          itemKey: f.key,
          section: list.section || null,
          placeholder: f.placeholder || ''

      });
    });
    return out;

  function supersededKeys(lists) {
    const dead = {};
    LIST_DEFS.forEach(function (list) {
      const items = lists && lists[list.key];
      if (!Array.isArray(items) || !items.length) return;
      (list.supersedes || []).forEach(function (k) { dead[k] = 1; });
    });
    return dead;
  }

  FIELD_DEFS.forEach(function (d) { FIELD_MAP[d.key] = d; });

    fillFileInput: true,        // 自动把简历挂到 file 控件
    matchThreshold: 66,         // 匹配分数阈值
    customFields: [],           // [{key,label,aliases:[],type,value}]
    siteRules: {},              // { "hostname": [{selector, fieldKey}] }
    lastFillAt: 0
  };

    listItemFields: listItemFields,
    supersededKeys: supersededKeys,
    DEFAULT_PROFILE: DEFAULT_PROFILE,
    DEFAULT_SETTINGS: DEFAULT_SETTINGS
  };
});

    for (let i = 0; i < SECTION_RULES.length; i++) {
      if (SECTION_RULES[i].re.test(t)) return SECTION_RULES[i].section;
    }
    return null;
  }

  function isHeadingLike(el) {
    if (!el || !el.tagName) return false;
    if (/^H[1-6]$/.test(el.tagName)) return true;
    if (el.tagName === 'LEGEND' || el.tagName === 'CAPTION' || el.tagName === 'SUMMARY') return true;
    const cls = (el.getAttribute && (el.getAttribute('class') || '')) + ' ' +
      (el.getAttribute && (el.getAttribute('role') || ''));
    return /(title|heading|header|section|legend|subtitle|panel-head|card-head|group)/i.test(cls);
  }

  /** 向上寻找最近的、能识别出分区的标题文本 */
  function inferSection(el) {
    if (!el) return null;

    const fs = el.closest && el.closest('fieldset');
    if (fs) {
      const lg = fs.querySelector('legend');
      if (lg) { const s = sectionOfText(lg.textContent); if (s) return s; }
    }

    let node = el;
    let level = 0;
    while (node && level < 6) {
      let sib = node.previousElementSibling;
      let guard = 0;
      while (sib && guard < 10) {
        const s = sectionOfText(sib.textContent);
        if (s) return s;
        // 标题类元素内容也可能就是分区名
        if (isHeadingLike(sib)) {
          const s2 = sectionOfText(sib.textContent);
          if (s2) return s2;
        }
        sib = sib.previousElementSibling;
        guard++;
      }
      // 父容器自身若带 title/heading 类名，取它自己的直接文本
      if (node.parentElement && isHeadingLike(node.parentElement)) {
        const s3 = sectionOfText(node.parentElement.textContent);
        if (s3) return s3;
      }
      node = node.parentElement;
      level++;
    }
    return null;
  }

  /* ============================== 匹配打分 ============================== */

  /**
   * 构建匹配索引：把字段别名归一化并缓存
   * 别名分三类：
   *   - 普通别名：正常权重
   *   - weakAliases：英文/极短通用词，扣 22 分，避免被 name/id/class 等弱来源误触发
   *   - ambiguousAliases：脱离分区就无法判断归属的别名（如裸的"开始时间"），
   *     在没有推断出分区时直接放弃匹配，宁可不填也不填错
   */
  function buildIndex(fields) {
    return fields.map(function (f) {
      const ambiguous = (f.ambiguousAliases || []).map(normalize);
      const list = [];
      const seen = {};
      const addAlias = function (raw, weak) {
        const a = normalize(raw);
        if (!a || a.length < 2 || seen[a]) return;
        seen[a] = 1;
        list.push({ a: a, weak: !!weak, ambiguous: ambiguous.indexOf(a) !== -1 });
      };
      (f.aliases || []).forEach(function (a) { addAlias(a, false); });
      (f.weakAliases || []).forEach(function (a) { addAlias(a, true); });
      return {
        field: f,
        key: f.key,
        aliases: list,
        avoids: (f.avoid || []).map(normalize).filter(Boolean),
        section: f.section || null,
        type: f.type || 'text'
      };
    });
  }

  function typeCompatible(field, el) {
    const tag = el.tagName ? el.tagName.toLowerCase() : '';
    const it = (el.getAttribute && el.getAttribute('type') || 'text').toLowerCase();
    const ftype = field.type || 'text';

    // 文件类只与文件控件互配
    if (tag === 'input' && it === 'file') return ftype === 'file';
    if (ftype === 'file') return false;

    if (tag === 'input') {
      if (['hidden', 'password', 'submit', 'button', 'reset', 'image', 'checkbox', 'range', 'color', 'search'].indexOf(it) !== -1) return false;
      if (it === 'radio') return ftype === 'select' || ftype === 'radio';
      if (it === 'email') return ftype === 'email';
      return true;
    }
    // textarea 也能承载普通文本字段（很多网申把"现居住地/籍贯"做成多行框），
    // 只是长文本字段会拿到额外加分，优先胜出。
    if (tag === 'textarea') {
      return ftype !== 'file';
    }
    if (tag === 'select') return ftype === 'select' || ftype === 'text' || ftype === 'month' || ftype === 'date' || ftype === 'number';
    if (tag === 'div' || tag === 'span' || tag === 'a' || tag === 'button') return true;
    return false;
  }

  /**
   * 核心打分
   * @param {Array} ctx collectContext 的结果
   * @param {string|null} section inferSection 的结果
   * @param {Array} index buildIndex 的结果
   * @param {number} threshold
   * @param {Element} [el] 目标控件，用于控件类型加成
   */
  function pickBest(ctx, section, index, threshold, el) {
    const tag = el && el.tagName ? el.tagName.toLowerCase() : '';
    const it = el && el.getAttribute ? (el.getAttribute('type') || 'text').toLowerCase() : '';
    let best = null;
    for (let i = 0; i < index.length; i++) {
      const entry = index[i];
      if (!entry.aliases.length) continue;
      for (let a = 0; a < entry.aliases.length; a++) {
        const al = entry.aliases[a];
        // 分区未知时，不拿"开始时间"这类歧义别名去猜
        if (al.ambiguous && !section) continue;
        for (let c = 0; c < ctx.length; c++) {
          const item = ctx[c];
          if (item.text.indexOf(al.a) === -1) continue;

          // 硬排除：该字段不适合出现在这种上下文里
          let avoided = false;
          for (let v = 0; v < entry.avoids.length; v++) {
            if (item.text.indexOf(entry.avoids[v]) !== -1) { avoided = true; break; }
          }
          if (avoided) continue;

          let score = item.weight + Math.min(al.a.length, 10) * 3;
          if (al.weak) score -= 22;
          if (entry.section && section && entry.section !== section) score -= 26;
          if (item.text === al.a) score += 4;
          // 控件类型加成：让多行框优先配长文本字段、tel 框优先配手机号
          if (tag === 'textarea' && entry.type === 'textarea') score += 8;
          if (it === 'tel' && entry.type === 'tel') score += 6;

          if (!best || score > best.score) {
            best = {
              fieldKey: entry.key,
              field: entry.field,
              score: score,
              alias: al.a,
              source: item.source,
              matchedText: item.text
            };
          }
        }
      }
    }
    if (!best) return null;
    const limit = typeof threshold === 'number' ? threshold : 66;
    return best.score >= limit ? best : null;
  }

  /* ============================== 值格式化 ============================== */

  /** 从各种写法里解析年月日 */
  function parseDateParts(value) {
    if (value === null || value === undefined) return null;
    const s = toHalfWidth(String(value)).trim();
    if (!s) return null;
    if (/至今|现在|now|present|无/i.test(s)) return { raw: s, ongoing: true };

    let m = s.match(/^(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})/);
    if (m) return { y: m[1], m: pad2(m[2]), d: pad2(m[3]) };

    m = s.match(/^(\d{4})\s*[-/.年]\s*(\d{1,2})/);
    if (m) return { y: m[1], m: pad2(m[2]), d: null };

    m = s.match(/^(\d{4})\s*年?\s*$/);
    if (m) return { y: m[1], m: null, d: null };

    m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (m) return { y: m[1], m: pad2(m[2]), d: pad2(m[3]) };

    m = s.match(/^(\d{4})(\d{2})$/);
    if (m) return { y: m[1], m: pad2(m[2]), d: null };

    return { raw: s };
  }

  function pad2(v) { return String(v).length === 1 ? '0' + v : String(v); }

  /**
   * 按目标控件的要求改写取值
   */
  function formatValue(value, el, field) {
    if (value === null || value === undefined || value === '') return '';
    const str = String(value);
    const type = (el && el.getAttribute && el.getAttribute('type') || '').toLowerCase();
    const placeholder = (el && el.getAttribute && el.getAttribute('placeholder') || '');
    const maxLength = el && el.getAttribute ? parseInt(el.getAttribute('maxlength'), 10) : NaN;

    const wantsDate = type === 'date' || type === 'month' ||
      (field && (field.type === 'date' || field.type === 'month')) ||
      /(yyyy|yy|年|月|日)/i.test(placeholder);

    const parts = parseDateParts(str);
    if (parts && parts.ongoing) return str;
    if (!wantsDate || !parts || !parts.y) return str;

    const y = parts.y, mm = parts.m || '01', dd = parts.d || '01';

    if (type === 'date') return y + '-' + mm + '-' + dd;
    if (type === 'month') return y + '-' + mm;

    const ph = toHalfWidth(placeholder);
    if (/yyyy\s*年\s*mm\s*月\s*dd/i.test(ph)) return y + '年' + mm + '月' + dd + '日';
    if (/yyyy\s*年\s*mm\s*月/i.test(ph)) return y + '年' + mm + '月';
    if (/yyyy\s*年/i.test(ph) && !/mm/i.test(ph)) return y + '年';
    if (/yyyy-mm-dd/i.test(ph)) return y + '-' + mm + '-' + dd;
    if (/yyyy\/mm\/dd/i.test(ph)) return y + '/' + mm + '/' + dd;
    if (/yyyy\.mm\.dd/i.test(ph)) return y + '.' + mm + '.' + dd;
    if (/yyyy-mm/i.test(ph)) return y + '-' + mm;
    if (/yyyy\/mm/i.test(ph)) return y + '/' + mm;
    if (/yyyymmdd/i.test(ph)) return y + mm + dd;
    if (/yyyymm/i.test(ph)) return y + mm;

    if (!isNaN(maxLength) && maxLength === 4) return y;
    if (!isNaN(maxLength) && maxLength === 7) return y + '-' + mm;
    if (!isNaN(maxLength) && maxLength === 10) return y + '-' + mm + '-' + dd;

    // 中文界面默认「YYYY-MM」，仅在原值缺月份时补全
    if (!parts.m) return y;
    return str;
  }

  /* ============================== 选项匹配 ============================== */

  const VALUE_SYNONYMS = {
    '男': ['男', '男性', 'male', 'm', 'man', 'boy', '先生'],
    '女': ['女', '女性', 'female', 'f', 'woman', 'girl', '女士'],
    '本科': ['本科', '大学本科', '全日制本科', 'bachelor', 'undergraduate', 'bs', 'ba', '学士'],
    '大专': ['大专', '专科', '高职', 'college', 'associate'],
    '硕士研究生': ['硕士研究生', '硕士', '研究生', 'master', 'msc', 'ms'],
    '博士研究生': ['博士研究生', '博士', 'doctor', 'phd'],
    '学士': ['学士', 'bachelor', '本科'],
    '硕士': ['硕士', 'master', '研究生'],
    '是': ['是', 'yes', 'y', 'true', '接受', '愿意', '同意', '可以', '服从'],
    '否': ['否', 'no', 'n', 'false', '不接受', '不愿意', '不同意', '不可以', '不服从'],
    '汉族': ['汉族', '汉', 'han'],
    '未婚': ['未婚', 'single', 'unmarried'],
    '已婚': ['已婚', 'married'],
    '群众': ['群众', '普通群众', '无党派', 'masses'],
    '共青团员': ['共青团员', '团员', 'league member'],
    '中共党员': ['中共党员', '党员', '中国共产党党员', 'ccp member'],
    'CET-6': ['cet-6', 'cet6', '大学英语六级', '英语六级', '六级'],
    'CET-4': ['cet-4', 'cet4', '大学英语四级', '英语四级', '四级'],
    '实习': ['实习', 'intern', 'internship', '实习生'],
    '全职': ['全职', 'full-time', 'fulltime', '正式'],
    '随时到岗': ['随时到岗', '随时', '立即', '即刻', 'immediately', 'now', '一周内'],
    '面议': ['面议', 'negotiable', '可谈']
  };

  function optionVariants(value) {
    const v = normalize(value);
    const out = [v];
    const keys = Object.keys(VALUE_SYNONYMS);
    for (let i = 0; i < keys.length; i++) {
      const variants = VALUE_SYNONYMS[keys[i]].map(normalize);
      if (variants.indexOf(v) !== -1 || normalize(keys[i]) === v) {
        for (let j = 0; j < variants.length; j++) {
          if (out.indexOf(variants[j]) === -1) out.push(variants[j]);
        }
      }
    }
    return out;
  }

  /**
   * 在候选选项文本里挑出最匹配 value 的那个
   * @param {string} value 想要的值
   * @param {Array<string>} options 页面上的选项文本
   * @returns {string|null} 命中的原始选项文本
   */
  function chooseOption(value, options) {
    if (!value || !options || !options.length) return null;
    const variants = optionVariants(value);

    // 1. 精确归一化相等
    for (let i = 0; i < options.length; i++) {
      const n = normalize(options[i]);
      if (!n) continue;
      for (let v = 0; v < variants.length; v++) {
        if (n === variants[v]) return options[i];
      }
    }
    // 2. 选项包含目标值（"本科（学士）" 命中 "本科"）
    for (let i = 0; i < options.length; i++) {
      const n = normalize(options[i]);
      if (!n) continue;
      for (let v = 0; v < variants.length; v++) {
        if (variants[v].length >= 2 && n.indexOf(variants[v]) !== -1) return options[i];
      }
    }
    // 3. 目标值包含选项（"硕士研究生" 命中 "硕士"）
    for (let i = 0; i < options.length; i++) {
      const n = normalize(options[i]);
      if (!n || n.length < 2) continue;
      for (let v = 0; v < variants.length; v++) {
        if (variants[v].indexOf(n) !== -1) return options[i];
      }
    }
    return null;
  }

  /* ============================== 对外 API ============================== */

  function matchElement(el, opts) {
    opts = opts || {};
    // 隐藏元素永不参与匹配（content.js 会再过滤一次，这里做兜底）
    if (!opts.ignoreVisibility && !isVisible(el, opts)) return null;
    const index = opts.index || buildIndex(opts.fields || []);
    const ctx = collectContext(el, opts);
    const section = inferSection(el);
    const hit = pickBest(ctx, section, index, opts.threshold, el);
    if (!hit || !typeCompatible(hit.field, el)) return null;
    hit.section = section;
    return hit;
  }

  function isSelectLike(el) {
    if (!el) return false;
    const tag = el.tagName.toLowerCase();
    if (tag === 'select') return true;
    const role = (el.getAttribute('role') || '').toLowerCase();
    if (role === 'combobox' || role === 'listbox') return true;
    const cls = el.getAttribute('class') || '';
    if (/(ant-select|el-select|ivu-select|el-cascader|ant-cascader|semi-select|next-select|arco-select)/i.test(cls)) return true;
    const p = el.closest && el.closest('.ant-select,.el-select,.ivu-select,.semi-select,.next-select,.arco-select,[role="combobox"]');
    return !!p;
  }

  return {
    normalize: normalize,
    toHalfWidth: toHalfWidth,
    isVisible: isVisible,
    isCandidate: isCandidate,
    collectContext: collectContext,
    inferSection: inferSection,
    buildIndex: buildIndex,
    typeCompatible: typeCompatible,
    pickBest: pickBest,
    matchElement: matchElement,
    radioGroupOf: radioGroupOf,
    optionLabelOf: optionLabelOf,
    parseDateParts: parseDateParts,
    formatValue: formatValue,
    chooseOption: chooseOption,
    optionVariants: optionVariants,
    sectionOfText: sectionOfText,
    isSelectLike: isSelectLike,
    NOISE_WORDS: NOISE_WORDS
  };
});

    // 只给出无语义的 name，属于"识别不出来"的正常情况
    opaque: `<div><input type="text" id="o1" name="input_23" class="ipt"></div>`,

    // 容器式低代码表单（简道云 · 帆软的真实结构，2026-10 实测抓取）
    // 特征：input 无 id / name / placeholder / aria / data-*；
    //       标签在「包含 input 的容器的前一个兄弟」里，层级随框架变化。
    lowcode: `
      <div class="widget-list">
        <div class="fx-field x-grid-col-6">
          <div class="field-label"><span class="field-required">*</span><div class="field-name">姓名</div></div>
          <div class="field-component"><div class="fx-form-text"><div class="x-input normal-input">
            <div class="x-inner-wrapper"><input type="text" class="input-inner" id="lc1" autocomplete="new-password" value=""></div>
          </div></div></div>
        </div>
        <div class="fx-field x-grid-col-6">
          <div class="field-label"><span class="field-required">*</span><div class="field-name">民族</div></div>
          <div class="field-component"><div class="fx-form-text"><div class="x-input normal-input">
            <div class="x-inner-wrapper"><input type="text" class="input-inner" id="lc2"></div>
          </div></div></div>
        </div>
        <div class="fx-field x-grid-col-6">
          <div class="field-label"><span class="field-required">*</span><div class="field-name">手机</div></div>
          <div class="field-component"><div class="fx-form-text"><div class="x-input normal-input">
            <div class="x-inner-wrapper"><input type="text" class="input-inner" id="lc3"></div>
          </div></div></div>
        </div>
        <div class="fx-field x-grid-col-6">
          <div class="field-label"><span class="field-required">*</span><div class="field-name">邮箱</div></div>
          <div class="field-component"><div class="fx-form-text"><div class="x-input normal-input">
            <div class="x-inner-wrapper"><input type="text" class="input-inner" id="lc4"></div>
          </div></div></div>
        </div>
      </div>`,

    // 同一结构的负例：第二个字段没有 label，绝不能继承上一行的「姓名」
    lowcodeNeighbor: `
      <div class="widget-list">
        <div class="fx-field">
          <div class="field-label"><div class="field-name">姓名</div></div>
          <div class="field-component"><div class="x-input"><div class="x-inner-wrapper">
            <input type="text" class="input-inner" id="ln1"></div></div></div>
        </div>
        <div class="fx-field">
          <div class="field-component"><div class="x-input"><div class="x-inner-wrapper">
            <input type="text" class="input-inner" id="ln2"></div></div></div>
        </div>
      </div>`,

    // 回归：上一行是「自绘下拉」（内部没有原生控件），它的标签绝不能算到下一行头上。
    // 实测场景：简道云/帆软的「学位」是自绘下拉，导致后面真实的「学号」输入框
    // 被错配成 academicDegree —— 这类误填比漏填危险得多。
    lowcodeNoControlRow: `
      <div class="widget-list">
        <div class="fx-field x-grid-col-6">
          <div class="field-label"><span class="field-required">*</span><div class="field-name">学位</div></div>
          <div class="field-component"><div class="x-select"><div class="x-select-input">请选择</div></div></div>
        </div>
        <div class="fx-field x-grid-col-6">
          <div class="field-label"><span class="field-required">*</span><div class="field-name">学号</div></div>
          <div class="field-component"><div class="fx-form-text"><div class="x-input normal-input">
            <div class="x-inner-wrapper"><input type="text" class="input-inner" id="fr1" placeholder="若无学号可填写“无”"></div>
          </div></div></div>
        </div>
      </div>`,

    // 出生年月 / 身份证 / 民族 等
    personal: `
      <div><label for="p1">出生年月</label><input id="p1" type="text" placeholder="YYYY-MM"></div>
      <div><label for="p2">身份证号码</label><input id="p2" type="text"></div>
      <div><label for="p3">民族</label><input id="p3" type="text"></div>
      <div><label for="p4">籍贯</label><input id="p4" type="text"></div>
      <div><label for="p5">婚姻状况</label><select id="p5"><option>未婚</option><option>已婚</option></select></div>
      <div><label for="p6">是否服从调剂</label><select id="p6"><option>是</option><option>否</option></select></div>`
  };

  function run(document, M, S) {
    const profile = S.DEFAULT_PROFILE.fields;
    const index = M.buildIndex(S.FIELD_DEFS);
    const results = [];

    // 夹具挂载点：浏览器自测页会提供一个「屏幕外的宿主容器」。
    // 若直接写 document.body.innerHTML，会把页面自己的结果区域一起冲掉，
    // 导致在浏览器里打开自测页只能看到最后一个夹具（Node 侧没这个容器，回退 body）。
    const host = document.getElementById('nrfa-fixture-host') || document.body;
    const mount = (html) => { host.innerHTML = html; };
    const matchOne = (el) => M.matchElement(el, { index: index, threshold: 66 });
    const keyOf = (el) => (matchOne(el) || {}).fieldKey;
    const check = (name, actual, expected) => {
      const a = String(actual);
      const e = String(expected);
      results.push({ name, ok: a === e, actual: a, expected: e });
    };
    const checkTrue = (name, cond, detail) => {
      results.push({ name, ok: !!cond, actual: detail === undefined ? String(!!cond) : String(detail), expected: 'true' });
    };
    const group = (title) => results.push({ group: title });

    /* ---------------- 1. 表格布局 ---------------- */
    group('表格布局（左标签 / 右控件）');
    mount(FIXTURES.tableLayout);
    check('姓名', keyOf(document.getElementById('f1')), 'name');
    check('手机号码', keyOf(document.getElementById('f2')), 'phone');
    check('电子邮箱', keyOf(document.getElementById('f3')), 'email');
    check('紧急联系人姓名 ≠ 姓名', keyOf(document.getElementById('f4')), 'emergencyContactName');
    check('紧急联系人电话 ≠ 手机号', keyOf(document.getElementById('f5')), 'emergencyContactPhone');

    group('表头列布局（thead 定义字段名）');
    mount(FIXTURES.headColumnLayout);
    check('姓名（表头）', keyOf(document.getElementById('h1')), 'name');
    check('最高学历（表头）', keyOf(document.getElementById('h2')), 'degree');
    check('期望城市（表头）', keyOf(document.getElementById('h3')), 'expectedCity');

    group('标签在独立单元格 / 带冒号与必填星号');
    mount(FIXTURES.labelInCell);
    check('所学专业', keyOf(document.getElementById('c1')), 'major');    check('毕业院校（跨标签节点）', keyOf(document.getElementById('c2')), 'school');
    check('政治面貌：', keyOf(document.getElementById('c3')), 'politicalStatus');

    /* ---------------- 2. label for ---------------- */
    group('label for 布局');
    mount(FIXTURES.labelFor);
    check('毕业院校', keyOf(document.getElementById('a1')), 'school');
    check('所学专业', keyOf(document.getElementById('a2')), 'major');
    check('最高学历（select）', keyOf(document.getElementById('a3')), 'degree');
    check('预计毕业时间', keyOf(document.getElementById('a4')), 'eduEnd');

    /* ---------------- 2b. 容器式低代码表单（简道云 · 帆软真实结构） ---------------- */
    group('容器式低代码表单（标签是祖先容器的前兄弟）');
    mount(FIXTURES.lowcode);
    check('姓名（无 id/name/placeholder）', keyOf(document.getElementById('lc1')), 'name');
    check('民族', keyOf(document.getElementById('lc2')), 'nation');
    check('手机', keyOf(document.getElementById('lc3')), 'phone');
    check('邮箱', keyOf(document.getElementById('lc4')), 'email');

    group('低代码表单的负例（上一行的标签不能串到本行）');
    mount(FIXTURES.lowcodeNeighbor);
    check('第一个字段认出姓名', keyOf(document.getElementById('ln1')), 'name');
    check('无标签字段不继承上一行', String(keyOf(document.getElementById('ln2'))), 'undefined');

    group('低代码表单的负例（上一行是自绘下拉，内部无原生控件）');
    mount(FIXTURES.lowcodeNoControlRow);
    checkTrue('学号不该被上一行的「学位」抢走', keyOf(document.getElementById('fr1')) !== 'academicDegree',
      '实际=' + String(keyOf(document.getElementById('fr1'))));

    /* ---------------- 3. Ant Design 结构 ---------------- */
    group('Ant Design 结构');
    mount(FIXTURES.antdStyle);
    const antInputs = document.querySelectorAll('.ant-input');
    check('期望职位', keyOf(antInputs[0]), 'expectedPosition');
    check('期望城市', keyOf(antInputs[1]), 'expectedCity');

    /* ---------------- 4. 单选组 ---------------- */
    group('单选组');
    mount(FIXTURES.radioGender);
    const radios = document.querySelectorAll('input[name=gender]');
    check('性别（容器文本剔除选项后识别）', (matchOne(radios[0]) || {}).fieldKey, 'gender');
    const optionTexts = Array.prototype.map.call(radios, (r) => r.parentNode.textContent.trim());
    check('选项命中「男」', M.chooseOption('男', optionTexts), '男');

    /* ---------------- 5. 分区推断 ---------------- */
    group('分区推断（教育 / 实习 同名时间字段）');
    mount(FIXTURES.sectioned);
    check('教育-开始时间', keyOf(document.getElementById('s1')), 'eduStart');
    check('教育-结束时间', keyOf(document.getElementById('s2')), 'eduEnd');
    check('实习-开始时间', keyOf(document.getElementById('s3')), 'intern1Start');
    check('实习-结束时间', keyOf(document.getElementById('s4')), 'intern1End');

    /* ---------------- 6. 安全：不该填的绝不填 ---------------- */
    group('安全边界（搜索框 / 验证码 / 密码 / 隐藏项 / 无语义字段）');
    mount(FIXTURES.shouldNotMatch);
    check('搜索职位 → 不匹配', String(matchOne(document.getElementById('n1'))), 'null');
    check('图形验证码 → 不匹配', String(matchOne(document.getElementById('n2'))), 'null');
    check('密码 → 不匹配', String(matchOne(document.getElementById('n3'))), 'null');
    check('确认密码 → 不匹配', String(matchOne(document.getElementById('n4'))), 'null');
    check('display:none → 不匹配', String(matchOne(document.getElementById('n5'))), 'null');
    check('用户名 → 不匹配姓名', String(matchOne(document.getElementById('n6'))), 'null');
    checkTrue('isCandidate 排除隐藏元素', M.isCandidate(document.getElementById('n5'), {}) === false);
    checkTrue('isCandidate 排除密码框', M.isCandidate(document.getElementById('n3'), {}) === false);
    mount(FIXTURES.opaque);
    check('无语义 name=input_23 → 不匹配', String(matchOne(document.getElementById('o1'))), 'null');

    /* ---------------- 7. 控件类型匹配 ---------------- */
    group('控件类型匹配');
    mount(FIXTURES.textareas);
    check('textarea ← 自我评价', keyOf(document.getElementById('t1')), 'selfEvaluation');
    check('textarea ← 专业技能', keyOf(document.getElementById('t2')), 'skills');
    check('input ← 姓名', keyOf(document.getElementById('t3')), 'name');
    check('textarea ← 现居住地', keyOf(document.getElementById('t4')), 'address');

    /* ---------------- 8. 英文表单 ---------------- */
    group('英文表单');
    mount(FIXTURES.englishForm);
    check('Name', keyOf(document.getElementById('e1')), 'name');
    check('Gender', keyOf(document.getElementById('e2')), 'gender');
    check('Email（type=email 只配邮箱字段）', keyOf(document.getElementById('e3')), 'email');
    check('Mobile Phone', keyOf(document.getElementById('e4')), 'phone');

    /* ---------------- 9. 归一化 ---------------- */
    group('文本归一化');
    mount(FIXTURES.noiseText);
    check('"姓 名 * 请输入姓名（必填）"', keyOf(document.getElementById('z1')), 'name');
    check('全角冒号', M.normalize('姓名：'), '姓名');
    check('噪声词', M.normalize('请输入姓名'), '姓名');
    check('星号 + 必填标记', M.normalize('* 手机号码（必填）'), '手机号码');
    check('大小写与连字符', M.normalize('E-mail Address'), 'emailaddress');
    check('全角英数', M.normalize('ＥＭＡＩＬ'), 'email');

    /* ---------------- 10. 求职意向与经历 ---------------- */
    group('求职意向 / 实习经历');
    mount(FIXTURES.jobIntent);
    check('应聘职位', keyOf(document.getElementById('j1')), 'expectedPosition');
    check('期望工作地点', keyOf(document.getElementById('j2')), 'expectedCity');
    check('期望薪资', keyOf(document.getElementById('j3')), 'expectedSalary');
    check('最快到岗时间', keyOf(document.getElementById('j4')), 'availableDate');
    check('英语等级', keyOf(document.getElementById('j5')), 'englishLevel');
    check('实习公司名称', keyOf(document.getElementById('j6')), 'intern1Company');
    check('实习职位', keyOf(document.getElementById('j7')), 'intern1Position');

    /* ---------------- 11. 个人信息 ---------------- */
    group('个人信息');
    mount(FIXTURES.personal);
    check('出生年月', keyOf(document.getElementById('p1')), 'birth');
    check('身份证号码', keyOf(document.getElementById('p2')), 'idCard');
    check('民族', keyOf(document.getElementById('p3')), 'nation');
    check('籍贯', keyOf(document.getElementById('p4')), 'nativePlace');
    check('婚姻状况', keyOf(document.getElementById('p5')), 'maritalStatus');
    check('是否服从调剂', keyOf(document.getElementById('p6')), 'acceptAdjust');

    /* ---------------- 12. 日期格式化 ---------------- */
    group('日期格式化');
    const elWith = (attrs) => {
      const i = document.createElement('input');
      Object.keys(attrs).forEach((k) => i.setAttribute(k, attrs[k]));
      return i;
    };
    check('type=date → YYYY-MM-DD', M.formatValue('2023-09', elWith({ type: 'date' }), { type: 'month' }), '2023-09-01');
    check('type=month → YYYY-MM', M.formatValue('2023-09-15', elWith({ type: 'month' }), { type: 'month' }), '2023-09');
    check('placeholder YYYY-MM', M.formatValue('2023-09', elWith({ placeholder: 'YYYY-MM' }), { type: 'month' }), '2023-09');
    check('placeholder YYYY年MM月', M.formatValue('2023-09', elWith({ placeholder: 'YYYY年MM月' }), { type: 'month' }), '2023年09月');
    check('placeholder YYYY/MM/DD', M.formatValue('2023-09-15', elWith({ placeholder: 'YYYY/MM/DD' }), { type: 'date' }), '2023/09/15');
    check('maxlength=4 只留年', M.formatValue('2023-09', elWith({ maxlength: '4' }), { type: 'month' }), '2023');
    check('"至今" 原样保留', M.formatValue('至今', elWith({}), { type: 'month' }), '至今');
    check('非日期字段不改写', M.formatValue('测试文本', elWith({}), { type: 'text' }), '测试文本');
    check('"2023年9月" → 补零', M.formatValue('2023年9月', elWith({ placeholder: 'YYYY-MM' }), { type: 'month' }), '2023-09');
    check('"202309" → YYYY-MM', M.formatValue('202309', elWith({ placeholder: 'YYYY-MM' }), { type: 'month' }), '2023-09');

    /* ---------------- 13. 选项匹配 ---------------- */
    group('下拉 / 单选选项匹配');
    check('本科 ← 精确', M.chooseOption('本科', ['请选择', '大专', '本科', '硕士研究生']), '本科');
    check('本科 ← 大学本科', M.chooseOption('本科', ['大专', '大学本科', '硕士']), '大学本科');
    check('硕士研究生 ← 硕士', M.chooseOption('硕士研究生', ['本科', '硕士', '博士']), '硕士');
    check('本科 ← 本科（学士）', M.chooseOption('本科', ['专科', '本科（学士）', '硕士']), '本科（学士）');
    check('CET-6 ← 大学英语六级', M.chooseOption('CET-6', ['大学英语四级', '大学英语六级', '无']), '大学英语六级');
    check('男 ← Male', M.chooseOption('男', ['Male', 'Female']), 'Male');
    check('是 ← Yes', M.chooseOption('是', ['Yes', 'No']), 'Yes');
    check('否 ← No', M.chooseOption('否', ['Yes', 'No']), 'No');
    check('找不到 → null', M.chooseOption('火星语', ['甲', '乙']), 'null');
    check('空值 → null', M.chooseOption('', ['甲']), 'null');

    /* ---------------- 14. 空白档案模板 ----------------
       仓库里必须不带任何真实个人数据，否则 clone 的人会把别人的信息填进自己表单。
       这里既检查结构完整，也扫一遍常见个人信息的格式。 */
    group('空白档案模板与隐私');
    const blankKeys = Object.keys(profile);
    check('字段 key 数量与字典一致', blankKeys.length, S.FIELD_DEFS.length);
    check('模板无缺失字段',
      S.FIELD_DEFS.filter((d) => !blankKeys.includes(d.key)).map((d) => d.key).join(','), '');
    check('模板所有值都是空字符串',
      blankKeys.filter((k) => String(profile[k]).trim() !== '').join(','), '');
    checkTrue('模板名字是通用名而非真实姓名',
      /我的档案|未命名|默认/.test(S.DEFAULT_PROFILE.name), S.DEFAULT_PROFILE.name);

    const blob = JSON.stringify(S.DEFAULT_PROFILE);
    const leakPatterns = [
      [/1[3-9]\d{9}/, '手机号'],
      [/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/, '邮箱'],
      [/\d{17}[\dXx]/, '身份证号'],
      [/\d{16,19}/, '长数字串（银行卡/证件号）']
    ];
    leakPatterns.forEach((pair) => {
      const hit = blob.match(pair[0]);
      checkTrue('档案模板不含' + pair[1], !hit, hit ? hit[0] : '无');
    });

    /* ---------------- 15. 字段字典自检 ---------------- */
    group('字段字典自检');
    const keys = S.FIELD_DEFS.map((d) => d.key);
    checkTrue('字段 key 无重复', new Set(keys).size === keys.length,
      keys.filter((k, i) => keys.indexOf(k) !== i).join(','));
    const noAlias = S.FIELD_DEFS.filter((d) => !(d.aliases || []).length).map((d) => d.key);
    checkTrue('每个字段都有别名', noAlias.length === 0, noAlias.join(','));
    const badGroup = S.FIELD_DEFS.filter((d) => !d.group || !d.label).map((d) => d.key);
    checkTrue('每个字段都有 label 与 group', badGroup.length === 0, badGroup.join(','));

    return results;
  }

  root.NRFA_TEST_CASES = { FIXTURES, run };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function () {
  var out = document.getElementById('results');
  var results;
  try {
    results = NRFA_TEST_CASES.run(document, NRFA_MATCHER, NRFA_SCHEMA);
  } catch (e) {
    document.getElementById('env').textContent = '运行出错：' + e.message;
    return;
  }
  // 注意：results 里还混着分组标题（{group:'xxx'}，没有 ok 字段）。
  // 统计时必须先剔除，否则分组数会被算成"失败项"。
  var cases = results.filter(function (r) { return !r.group; });
  var pass = cases.filter(function (r) { return r.ok; }).length;
  var fail = cases.length - pass;
  document.getElementById('pass').textContent = pass;
  document.getElementById('fail').textContent = fail;
  document.getElementById('fail').className = 'big ' + (fail ? 'bad' : '');
  document.getElementById('bar').style.width = (cases.length ? Math.round(pass / cases.length * 100) : 0) + '%';
  document.getElementById('verdict').textContent = fail ? '有 ' + fail + ' 项未通过' : '全部通过 🎉';
  document.getElementById('verdict').style.color = fail ? 'var(--red)' : 'var(--green)';

  var html = '';
  results.forEach(function (r) {
    if (r.group) { html += '<h2>' + r.group + '</h2>'; return; }
    html += '<div class="case ' + (r.ok ? '' : 'fail') + '">'
      + '<span class="m">' + (r.ok ? '✅' : '❌') + '</span>'
      + '<span>' + r.name
      + '<span class="detail">期望：' + r.expected + ' ／ 实际：' + r.actual + '</span>'
      + '</span></div>';
  });
  out.innerHTML = html;

  document.getElementById('env').textContent =
    '运行环境：' + navigator.userAgent +
    '　·　用例总数 ' + cases.length + '（另有 ' + (results.length - cases.length) + ' 个分组标题）';
})();
</script>
</body>
</html>
