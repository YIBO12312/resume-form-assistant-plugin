<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-label="网申助手 Resume Form Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1220" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1280" height="280" rx="20" fill="url(#bg)"/>
  <circle cx="1180" cy="30" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="80" cy="260" r="120" fill="#ffffff" opacity="0.04"/>

  <!-- 图标：文档 + 绿色对勾 -->
  <g transform="translate(64, 60)" filter="url(#soft)">
    <rect width="160" height="160" rx="38" fill="url(#tile)"/>
    <rect x="40" y="26" width="80" height="102" rx="11" fill="#ffffff"/>
    <rect x="54" y="46" width="52" height="8" rx="4" fill="#94a3b8"/>
    <rect x="54" y="66" width="52" height="8" rx="4" fill="#94a3b8"/>
    <rect x="54" y="86" width="30" height="8" rx="4" fill="#94a3b8"/>
    <circle cx="114" cy="116" r="34" fill="#16a34a"/>
    <path d="M99 117 L109 128 L131 103" fill="none" stroke="#ffffff" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 文字 -->
  <text x="264" y="122" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="58" font-weight="700" fill="#ffffff">网申助手</text>
  <text x="266" y="164" font-family="-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="26" font-weight="500" fill="#bfdbfe" letter-spacing="1.5">Resume Form Assistant</text>

  <line x1="266" y1="186" x2="1216" y2="186" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="266" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="20" fill="#dbeafe">一键填完网申表单</text>
  <text x="470" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="20" fill="#93c5fd">·</text>
  <text x="500" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="20" fill="#dbeafe">81 个字段字典</text>
  <text x="662" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="20" fill="#93c5fd">·</text>
  <text x="692" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="20" fill="#dbeafe">兼容 React / Vue</text>
  <text x="896" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="20" fill="#93c5fd">·</text>
  <text x="926" y="222" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="20" fill="#dbeafe">纯本地不上传</text>
</svg>
